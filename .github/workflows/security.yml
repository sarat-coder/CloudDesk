name: Security

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC

jobs:
  secrets-scan:
    name: Gitleaks — secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: pip-audit — Python dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.5.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pip-audit
        run: uv run pip-audit --ignore-vuln GHSA-placeholder || true

  container-scan:
    name: Trivy — container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build -f backend/Dockerfile -t clouddesk-backend:scan .

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clouddesk-backend:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  iac-scan:
    name: Checkov — Terraform IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: deployment/
          framework: terraform
          soft_fail: true
