name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      cloud:
        required: true
        type: string
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      DEPLOY_ROLE_ARN:
        required: false
      AZURE_CLIENT_ID:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false

# Mapping: AWS = ECR/ECS Fargate/ALB, Azure = ACR/Container Apps, GCP = Artifact Registry/Cloud Run
# Auth is OIDC — no long-lived keys stored in GitHub secrets (§15 CLAUDE.md)

jobs:
  bootstrap-registry:
    name: Bootstrap registry
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — registry bootstrap
        run: echo "Registry bootstrap for ${{ inputs.cloud }}/${{ inputs.environment }}"

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: bootstrap-registry
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          echo "Building image tag: ${{ inputs.image_tag }}"
          echo "cloud=${{ inputs.cloud }}, env=${{ inputs.environment }}"

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform plan
        working-directory: deployment/${{ inputs.cloud }}
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag }}
        run: |
          terraform init -backend=false
          terraform validate
          echo "Plan would run here with backend credentials"

  # Production deploys require the prod-apply GitHub Environment (required reviewers)
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment == 'prod' && 'prod-apply' || inputs.environment }}
    steps:
      - name: Apply
        run: echo "Apply would run here with cloud credentials and reviewed plan"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: |
          echo "Smoke tests would run against deployed URL"
          bash deployment/scripts/smoke_test.sh || true
